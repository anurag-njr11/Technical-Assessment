name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  # REL-7: on main only, and only when a staging deployment is configured
  # (secret CONVEX_DEPLOY_KEY_STAGING; LLM_API_KEY is set on that deployment).
  regression-gate:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CONVEX_DEPLOY_KEY != ''
      - run: npx convex deploy -y
        if: env.CONVEX_DEPLOY_KEY != ''
      - run: node scripts/ci-gate.mjs
        if: env.CONVEX_DEPLOY_KEY != ''
